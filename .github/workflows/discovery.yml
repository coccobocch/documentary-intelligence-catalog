
name: Test Documentary Discovery

on:
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Eseguire anche il classificatore AI?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover documentaries using TMDB
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python discovery/tmdb_discover.py

      - name: Install AI dependencies
        if: ${{ inputs.run_ai }}
        run: |
          python -m pip install --upgrade pip
          pip install -r discovery/requirements-ai.txt

      - name: Classify documentaries using AI
        if: ${{ inputs.run_ai }}
        run: python discovery/classify_ai.py

      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-discovery-results
          path: |
            discovery/tmdb_discovery_results.json
            discovery/ai_classification_results.json
          if-no-files-found: warn
          retention-days: 14
