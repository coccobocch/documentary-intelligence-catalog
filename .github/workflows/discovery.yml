
name: Test Documentary Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test API TMDB
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python discovery/tmdb_test.py

      - name: Salva risultati TMDB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-test-results
          path: discovery/tmdb_test_results.json
          if-no-files-found: warn
